name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # Certification gate: fails the build if the game stops paying 96% ± 0.5%.
      # The seed is fixed and the result does not depend on the number of cores, so this is stable.
      - name: Certify fruits-96
        run: npm run simulate -- --game games/fruits-96.json --spins 5000000 --seed 42 --target 96

  docker:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Run checks in the test image
        run: |
          docker build --target test -t slottestyfer:test .
          docker run --rm slottestyfer:test
      - name: Start the stack (API + web) and wait until healthy
        run: docker compose up -d --build --wait
      - name: Smoke test through the web container
        run: |
          curl -fsS localhost:8080/ | grep -q '<title>SlotTestyfer</title>'
          curl -fsS localhost:8080/api/health
          curl -fsS -X POST localhost:8080/api/spin \
            -H 'content-type: application/json' \
            -d '{"gameId":"fruits-96","bet":500,"seed":42}'
      - name: Logs
        if: always()
        run: docker compose logs || true

  publish:
    # Publishes the image to GitHub Container Registry when a version tag is pushed (v1.2.3).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [check, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
