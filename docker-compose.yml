name: slottestyfer

services:
  api:
    build: .
    image: slottestyfer:local
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_PATH: /data/slottestyfer.db
      SIM_WORKERS: ${SIM_WORKERS:-}
      MAX_SPINS: ${MAX_SPINS:-100000000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - api-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: slottestyfer-web:local
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # One-off simulations from the command line, with the JSON report saved in ./reports:
  #   docker compose run --rm simulator
  #   docker compose run --rm simulator --game games/fruits-88.json --spins 10e6 --target 96
  simulator:
    image: slottestyfer:local
    build: .
    profiles: [tools]
    entrypoint: ['node', 'packages/simulator/dist/cli.js']
    command:
      - --game
      - games/fruits-96.json
      - --spins
      - '10000000'
      - --seed
      - '42'
      - --target
      - '96'
      - --out
      - /reports/fruits-96.json
    volumes:
      - ./reports:/reports

volumes:
  api-data:
