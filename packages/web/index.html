<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="SlotTestyfer: a slot game engine and RTP lab. Play rounds, run Monte Carlo simulations, analyse sessions and watch games live, with fictional credits."
    />
    <title>SlotTestyfer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>SlotTestyfer</h1>
          <p>Slot engine &amp; RTP lab</p>
        </div>
      </div>
      <nav class="tabs" aria-label="Views">
        <a href="#play" data-view="play">Play &amp; simulate</a>
        <a href="#analyze" data-view="analyze">Analyze</a>
        <a href="#live" data-view="live">Live</a>
      </nav>
      <p class="notice" role="note">
        <strong>Fictional credits only.</strong> No real money, no accounts, no payments.
      </p>
    </header>

    <div class="api-error" id="api-error" role="alert" hidden></div>

    <main>
      <div class="layout view" id="view-play">
        <section class="panel" id="play" aria-labelledby="play-title"></section>
        <section class="panel" id="simulate" aria-labelledby="simulate-title"></section>
      </div>
      <div class="view wide" id="view-analyze" hidden></div>
      <div class="view wide" id="view-live" hidden></div>
    </main>

    <footer class="footer">
      <span>Seeded mulberry32 RNG · Monte Carlo on worker threads · exact results per seed</span>
      <a href="/api/docs" target="_blank" rel="noopener">API docs</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
